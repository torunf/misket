# Visitor's language decides which tree is served. Turkish for tr-*, English
# for everything else; explicit /tr/ and /en/ paths always win.
map $http_accept_language $pref_lang {
    default          en;
    "~*^\s*tr"       tr;
    "~*[,;]\s*tr"    tr;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Coolify's proxy: keep redirects relative so the browser stays
    # on https instead of being bounced through http.
    absolute_redirect off;

    # Root → language home
    location = / { return 302 /$pref_lang/; }

    # Language-neutral links (used by the apps and App Store metadata)
    # e.g. /etut/privacy → /tr/etut/privacy for a Turkish visitor.
    location ~ ^/(etut|fence|sanita|squish|matte|pare|archivo|opsix|civics|pastel|support|privacy|findle)(/.*)?$ {
        return 302 /$pref_lang$request_uri;
    }

    # Old Turkish-only paths kept alive.
    location ^~ /destek/   { return 301 /$pref_lang/support/; }
    location ^~ /gizlilik/ { return 301 /$pref_lang/privacy/; }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff;
}
